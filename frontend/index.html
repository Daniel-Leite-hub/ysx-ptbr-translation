<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YS X Translation Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .original-copy{display:block;width:100%;resize:vertical;font-family:Consolas,"Cascadia Mono",monospace;color:var(--text)}
    .inline-copy{border:0;background:transparent;color:#c4b3fb;font-size:10px;cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.06em}
    .inline-copy:hover{text-decoration:underline}
    .effective-source{margin:0 0 10px;padding:9px 11px;border-radius:7px;background:#afa0ff12;border:1px solid #afa0ff2b;color:#cbbfff;font-size:11px}
    .effective-source[data-source="reviewed"]{background:#8bccac12;border-color:#8bccac30;color:#9bd1b5}
  </style>
</head>
<body><div id="app"><div class="splash">Carregando YS X Translation Studio…</div></div><script type="module" src="app.js"></script><script type="module" src="ui_enhancements.js"></script></body>
</html>
